<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comes&Bebes — Avisos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6e3; --surface:#f3f8f5; --surface-alt:#eef4f0;
  --text:#17281f; --text-muted:#4f6157;
  --primary:#285943; --primary-hover:#1c4131; --primary-soft:#dfe9e4; --on-primary:#ffffff;
  --secondary:#35758a; --accent:#d5a62e; --on-accent:#17281f;
  --danger:#9b2c2c; --danger-soft:#f7e6e6;
  --border:#6d8074; --border-subtle:#d7e0da;
  --shadow:rgba(23,40,31,.16); --ph-a:#cfe0d4; --ph-b:#e6d9bd;
}
[data-theme="dark"]{
  --bg:#2d1a11; --surface:#341e14; --surface-alt:#3d2419;
  --text:#fef5f1; --text-muted:#bfa899;
  --primary:#e99d7a; --primary-hover:#f2b193; --primary-soft:#4a2c1e; --on-primary:#2d1a11;
  --secondary:#b5cc79; --accent:#b5cc79; --on-accent:#2d1a11;
  --danger:#ff8a8a; --danger-soft:#4a2020;
  --border:#8a7365; --border-subtle:#4a3227;
  --shadow:rgba(0,0,0,.45); --ph-a:#4a3227; --ph-b:#5a3d2a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--surface-alt);line-height:1.5}

.harness{position:sticky;top:0;z-index:300;background:#17281f;color:#eef4f0;padding:10px 16px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:13px}
.harness strong{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;font-weight:600}
.harness .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.harness button{font:inherit;font-weight:500;cursor:pointer;background:transparent;color:#eef4f0;
  border:1px solid rgba(238,244,240,.3);border-radius:99px;padding:5px 13px}
.harness button[aria-pressed="true"]{background:#d5a62e;border-color:#d5a62e;color:#17281f;font-weight:600}
.harness .note{margin-left:auto;opacity:.5;font-size:12px}

.stage{padding:24px 16px 60px;display:flex;justify-content:center}
.device{background:var(--bg);border:1.5px solid var(--border-subtle);border-radius:14px;overflow:hidden;
  box-shadow:0 16px 44px var(--shadow);width:100%;position:relative}
.stage[data-view="web"] .device{max-width:1100px}
.stage[data-view="mobile"] .device{max-width:400px}
.stage[data-view="web"] .only-mobile{display:none !important}
.stage[data-view="mobile"] .only-web{display:none !important}

.hd{display:flex;align-items:center;gap:24px;padding:0 26px;height:70px;background:var(--bg);border-bottom:1.5px solid var(--border-subtle)}
.hd-m{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:58px;background:var(--bg);border-bottom:1.5px solid var(--border-subtle)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand .mark{width:36px;height:36px;flex:none}
.hd-m .brand .mark{width:31px;height:31px}
.brand .mark svg{width:100%;height:100%;display:block}
.brand .mark .tile{fill:var(--primary)} .brand .mark .book{fill:var(--accent)}
.brand .mark .spine{fill:var(--accent);opacity:.45} .brand .mark .ribbon{fill:var(--primary)}
.brand .name{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
.hd-m .brand .name{font-size:20px}
.nav{display:flex;gap:4px}
.nav a{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:9px;
  text-decoration:none;color:var(--text-muted);font-size:16px;font-weight:500}
.nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav a.on{color:var(--text);font-weight:700}
.nav a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-12px;height:3px;border-radius:3px;background:var(--primary)}
.spacer{flex:1}
.avatar{border-radius:50%;background:var(--secondary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.acct .avatar{width:36px;height:36px;font-size:15px;background:var(--primary);color:var(--on-primary)}
.acct{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 12px 4px 4px;background:none;
  border:1.5px solid var(--border-subtle);border-radius:99px;cursor:pointer;font:inherit;font-size:15px;font-weight:600;color:var(--text)}
.mini{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border-subtle);background:none;cursor:pointer;display:grid;place-items:center}
.mini .avatar{width:32px;height:32px;font-size:13px;background:var(--primary);color:var(--on-primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;
  border:1.5px solid transparent;border-radius:10px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-quiet{background:transparent;color:var(--text);border-color:var(--border-subtle)}

/* ── lista ── */
.wrap{max-width:660px;margin:0 auto;padding:28px 24px 44px}
.stage[data-view="mobile"] .wrap{padding:18px 14px 26px}
.head{display:flex;align-items:baseline;gap:16px;margin-bottom:24px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:40px;line-height:1.06;letter-spacing:-.02em}
.stage[data-view="mobile"] h1{font-size:32px}
.head .clear{margin-left:auto;background:none;border:0;cursor:pointer;font:inherit;font-size:15px;
  font-weight:600;color:var(--primary);min-height:48px;padding:0 6px}
.head .clear:hover{text-decoration:underline}

.daygroup{margin-bottom:26px}
.daygroup h2{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:10px}

.item{display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:13px;
  border:1.5px solid var(--border-subtle);background:var(--surface);margin-bottom:9px;position:relative}
.item.novo{border-color:var(--primary);background:var(--primary-soft)}
.item .ico{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);border:1.5px solid var(--border-subtle)}
.item .ico svg{width:21px;height:21px;stroke:var(--primary);fill:none;stroke-width:1.9}
.item .ico.av{background:var(--secondary);color:#fff;font-weight:700;font-size:16px;border:0}
.item .txt{flex:1;min-width:0;padding-right:6px}
.item .txt p{font-size:16px;line-height:1.45}
.item .txt b{font-weight:600}
.item .txt .quando{font-size:14px;color:var(--text-muted);margin-top:3px}
.item .thumb{width:52px;height:52px;flex:none;border-radius:9px;border:1.5px solid var(--border-subtle);
  background:linear-gradient(150deg,var(--ph-a),var(--ph-b))}
.item .more{width:44px;height:44px;flex:none;border:0;background:none;cursor:pointer;border-radius:9px;
  display:grid;place-items:center;color:var(--text-muted)}
.item .more:hover{background:var(--bg);color:var(--text)}
.item .more svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}

.menu{position:absolute;right:10px;top:52px;z-index:20;width:262px;background:var(--bg);
  border:1.5px solid var(--border-subtle);border-radius:12px;box-shadow:0 12px 32px var(--shadow);padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:11px;width:100%;min-height:48px;padding:0 12px;border:0;
  border-radius:9px;background:none;cursor:pointer;font:inherit;font-size:15px;color:var(--text);text-align:left}
.menu button:hover{background:var(--surface)}
.menu button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9}
.menu .del{color:var(--danger)}
.menu .del:hover{background:var(--danger-soft)}

.empty{text-align:center;padding:44px 20px;max-width:420px;margin:0 auto}
.empty .art{width:96px;height:96px;margin:0 auto 20px;display:block;stroke:var(--primary);fill:none;stroke-width:4.5;stroke-linecap:round}
.empty h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:29px;margin-bottom:9px}
.empty p{color:var(--text-muted);font-size:16px;margin-bottom:20px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);z-index:500;
  background:var(--text);color:var(--bg);border-radius:12px;padding:13px 16px;display:flex;align-items:center;
  gap:14px;box-shadow:0 12px 34px rgba(0,0,0,.35);font-size:15px;font-weight:500;transition:transform .22s ease}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:700;
  color:var(--bg);text-decoration:underline;min-height:44px;padding:0 4px}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }

.tabs{display:flex;background:var(--bg);border-top:1.5px solid var(--border-subtle);padding:6px 4px 10px}
.tabs a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--text-muted);position:relative}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs a span{font-size:13px;font-weight:500}
.tabs a.on{color:var(--primary)} .tabs a.on span{font-weight:700}
.tabs a.on::before{content:"";position:absolute;top:-6px;width:26px;height:3px;border-radius:3px;background:var(--primary)}
.tabs .pub{flex:none;width:78px}
.tabs .pub .circ{width:50px;height:50px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.tabs .pub .circ svg{width:25px;height:25px;stroke-width:2.4}
.tabs .pub span{color:var(--text);font-weight:600}
.hide{display:none !important}
</style>
</head>
<body>

<div class="harness">
  <div class="grp"><strong>Estado</strong>
    <button data-s="cheio" aria-pressed="true">Com avisos</button>
    <button data-s="vazio" aria-pressed="false">Sem avisos</button>
  </div>
  <div class="grp"><strong>Plataforma</strong>
    <button data-view="web" aria-pressed="true">Web</button>
    <button data-view="mobile" aria-pressed="false">Celular</button>
  </div>
  <div class="grp"><strong>Tema</strong>
    <button data-theme-btn="light" aria-pressed="true">Claro</button>
    <button data-theme-btn="dark" aria-pressed="false">Escuro</button>
  </div>
  <span class="note">O menu de cada aviso e o "Limpar tudo" funcionam.</span>
</div>

<div class="stage" id="stage" data-view="web">
<div class="device">

  <header class="hd only-web">
    <a class="brand" href="#"><span class="mark"><svg viewBox="0 0 32 32"><rect class="tile" width="32" height="32" rx="8"/><path class="book" d="M10 7.5h12a1.6 1.6 0 0 1 1.6 1.6v13.8a1.6 1.6 0 0 1-1.6 1.6H10z"/><rect class="spine" x="8.4" y="7.5" width="2.2" height="17" rx="1.1"/><path class="ribbon" d="M16.6 7.5h4.2v6.6l-2.1-1.7-2.1 1.7z"/></svg></span><span class="name">Comes&amp;Bebes</span></a>
    <nav class="nav">
      <a href="#"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg>Início</a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>Salvos</a>
      <a href="#" class="on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>Avisos</a>
    </nav>
    <span class="spacer"></span>
    <button class="btn btn-primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Publicar</button>
    <button class="acct"><span class="avatar">F</span>Fagner</button>
  </header>
  <header class="hd-m only-mobile">
    <a class="brand" href="#"><span class="mark"><svg viewBox="0 0 32 32"><rect class="tile" width="32" height="32" rx="8"/><path class="book" d="M10 7.5h12a1.6 1.6 0 0 1 1.6 1.6v13.8a1.6 1.6 0 0 1-1.6 1.6H10z"/><rect class="spine" x="8.4" y="7.5" width="2.2" height="17" rx="1.1"/><path class="ribbon" d="M16.6 7.5h4.2v6.6l-2.1-1.7-2.1 1.7z"/></svg></span><span class="name">Comes&amp;Bebes</span></a>
    <button class="mini"><span class="avatar">F</span></button>
  </header>

  <div class="wrap">
    <div class="head">
      <h1>Avisos</h1>
      <button class="clear" id="clear">Limpar tudo</button>
    </div>
    <div id="lista"></div>

    <div class="empty hide" id="vazio">
      <svg class="art" viewBox="0 0 100 100"><path d="M74 42a24 24 0 0 0-48 0c0 24-12 28-12 28h72s-12-4-12-28"/><path d="M57 82a8 8 0 0 1-14 0"/></svg>
      <h2>Nada por aqui ainda</h2>
      <p>Quando alguém guardar ou reagir a alguma coisa que você publicou, a gente conta.</p>
      <button class="btn btn-primary">Publicar algo que você fez</button>
    </div>
  </div>

  <nav class="tabs only-mobile">
    <a href="#"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg><span>Início</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg><span>Salvos</span></a>
    <a href="#" class="pub"><span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg></span><span>Publicar</span></a>
    <a href="#" class="on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg><span>Avisos</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span>Perfil</span></a>
  </nav>

</div>
</div>

<div class="toast" id="toast"><span id="tmsg">Avisos limpos.</span><button id="undo">Desfazer</button></div>

<script>
const stage=document.getElementById('stage'), lista=document.getElementById('lista');
const ICO={
  guardou:'<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>',
  reagiu:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5v.01M15 9.5v.01"/></svg>',
  colecao:'<svg viewBox="0 0 24 24"><path d="M4 7h16v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M7 4h10v3H7z"/></svg>',
  versao:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></svg>',
  convite:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M17 8h5M19.5 5.5v5"/></svg>'
};
// Nenhum aviso traz numero. "e mais gente" no lugar de "3 pessoas".
const AVISOS=[
  {d:'Hoje',itens:[
    {t:'guardou',novo:true,thumb:true,av:'M',
     html:'<b>Maria</b> guardou seu <b>bolo de fubá</b> em <b>Doces de festa</b>.',q:'há 20 minutos'},
    {t:'reagiu',novo:true,thumb:true,
     html:'<b>Ficou lindo</b>, disseram do seu <b>pão de queijo</b>.',q:'há 2 horas'},
    {t:'colecao',novo:true,col:true,
     html:'<b>Comida de vó</b> tem coisas novas.',q:'há 3 horas'}
  ]},
  {d:'Ontem',itens:[
    {t:'versao',thumb:true,av:'J',
     html:'<b>João</b> fez a própria versão do seu <b>bolo de fubá</b>.',q:'ontem, às 19:40'},
    {t:'guardou',thumb:true,
     html:'<b>Ana</b> e mais gente guardaram seu <b>bolo de fubá</b>.',q:'ontem, às 15:02'},
    {t:'convite',av:'M',
     html:'<b>Maria</b> compartilhou a coleção <b>Doces de festa</b> com você.',q:'ontem, às 09:10'}
  ]},
  {d:'Esta semana',itens:[
    {t:'colecao',col:true,html:'<b>Pães sem pressa</b> tem coisas novas.',q:'terça-feira'}
  ]}
];

let removidos=[];
function render(){
  lista.innerHTML=AVISOS.map((g,gi)=>
    `<div class="daygroup"><h2>${g.d}</h2>${g.itens.map((it,ii)=>`
      <div class="item ${it.novo?'novo':''}" data-k="${gi}-${ii}">
        ${it.av ? `<span class="ico av">${it.av}</span>` : `<span class="ico">${ICO[it.t]}</span>`}
        <div class="txt"><p>${it.html}</p><p class="quando">${it.q}</p></div>
        ${it.thumb?'<span class="thumb"></span>':''}
        <button class="more" aria-label="Opções deste aviso" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
        <div class="menu">
          ${it.col?`<button><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 4 6M21 9l-4 6"/></svg>Parar de avisar sobre esta coleção</button>`:''}
          <button class="del"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>Apagar este aviso</button>
        </div>
      </div>`).join('')}</div>`).join('');
  bind();
}
function bind(){
  lista.querySelectorAll('.more').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const m=b.nextElementSibling, aberto=m.classList.contains('open');
    lista.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));
    m.classList.toggle('open',!aberto); b.setAttribute('aria-expanded',!aberto);
  });
  lista.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const it=b.closest('.item'); it.remove();
    mostrarToast('Aviso apagado.');   // reversivel: desfazer, nao confirmacao
  });
}
document.addEventListener('click',()=>lista.querySelectorAll('.menu').forEach(m=>m.classList.remove('open')));

const toast=document.getElementById('toast');
let tt=null;
function mostrarToast(msg){
  document.getElementById('tmsg').textContent=msg;
  toast.classList.add('show'); clearTimeout(tt);
  tt=setTimeout(()=>toast.classList.remove('show'),8000);
}
document.getElementById('clear').onclick=()=>{
  lista.innerHTML=''; document.getElementById('vazio').classList.remove('hide');
  mostrarToast('Avisos limpos.');
};
document.getElementById('undo').onclick=()=>{
  toast.classList.remove('show'); document.getElementById('vazio').classList.add('hide'); render();
};
function setState(k){
  document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===k));
  toast.classList.remove('show');
  if(k==='vazio'){ lista.innerHTML=''; document.getElementById('vazio').classList.remove('hide'); }
  else { document.getElementById('vazio').classList.add('hide'); render(); }
}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setState(b.dataset.s));
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{stage.dataset.view=b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.onclick=()=>{
  document.documentElement.setAttribute('data-theme',b.dataset.themeBtn);
  document.querySelectorAll('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
setState('cheio');
</script>
</body>
</html>
