app:
  time-zone: America/Sao_Paulo
  security:
    blocked-username-hmac-secret: ${USER_BLOCKED_USERNAME_HMAC_SECRET}
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${COMESEBEBES_JWT_ISSUER:comesebebes}
    jwt-expiration-minutes: ${COMESEBEBES_JWT_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${COMESEBEBES_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    device-inactivity-timeout-days: ${COMESEBEBES_DEVICE_INACTIVITY_TIMEOUT_DAYS:7}
  rate-limit:
    login:
      max-attempts: ${COMESEBEBES_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${COMESEBEBES_LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
  storage:
    local:
      path: ${COMESEBEBES_IMAGE_STORAGE_PATH:./uploads/images}
  image-validator:
    url: ${COMESEBEBES_IMAGE_VALIDATOR_URL:http://localhost:8001}
  cors:
    allowed-origins: ${COMESEBEBES_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  webauthn:
    relying-party-id: ${COMESEBEBES_WEBAUTHN_RP_ID:localhost}
    relying-party-name: ${COMESEBEBES_WEBAUTHN_RP_NAME:Comes&Bebes}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 50
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:comesebebes}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: flyway,application
    default-schema: flyway
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: application

server:
  port: ${COMESEBEBES_SERVER_PORT:8092}
  tomcat:
    max-http-form-post-size: 16MB
    max-swallow-size: 16MB
  error:
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-} sessionId=%X{sessionId:-} userId=%X{userId:-}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    doc-expansion: none
    display-request-duration: true
    filter: true
    url: ${COMESEBEBES_SWAGGER_UI_URL:/v3/api-docs}
    config-url: ${COMESEBEBES_SWAGGER_CONFIG_URL:/v3/api-docs/swagger-config}
    oauth2-redirect-url: ${COMESEBEBES_SWAGGER_OAUTH2_REDIRECT_URL:/swagger-ui/oauth2-redirect.html}
  show-actuator: false
