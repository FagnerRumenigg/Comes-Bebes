app:
  time-zone: America/Sao_Paulo
  # Usado só pra montar o link de "esqueci minha senha" que vai por e-mail
  # (docs/telas/11-recuperar-senha.html) — precisa ser a origem real do front.
  frontend-url: ${COMESEBEBES_FRONTEND_URL:http://localhost:5173}
  email:
    # "log" (padrao local, so loga e nao manda de verdade) ou "azure" (Azure
    # Communication Services Email, mesmo recurso do Entertain-Me).
    delivery-mode: ${COMESEBEBES_EMAIL_DELIVERY_MODE:log}
    sender-address: ${COMESEBEBES_EMAIL_SENDER_ADDRESS:noreply@comesebebes.com}
  security:
    blocked-username-hmac-secret: ${USER_BLOCKED_USERNAME_HMAC_SECRET}
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${COMESEBEBES_JWT_ISSUER:comesebebes}
    jwt-expiration-minutes: ${COMESEBEBES_JWT_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${COMESEBEBES_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    # Igual a refresh-token-expiration-days de propósito (produto5.md v5 §5.5: "30 dias
    # de inatividade, renovados a cada uso" é uma promessa só, não duas janelas
    # sobrepostas — antes era 7 dias e cortava a sessão bem antes do prazo prometido.
    device-inactivity-timeout-days: ${COMESEBEBES_DEVICE_INACTIVITY_TIMEOUT_DAYS:30}
  rate-limit:
    login:
      max-attempts: ${COMESEBEBES_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${COMESEBEBES_LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
    publication:
      max-attempts: ${COMESEBEBES_PUBLICATION_RATE_LIMIT_MAX_ATTEMPTS:3}
      window-seconds: ${COMESEBEBES_PUBLICATION_RATE_LIMIT_WINDOW_SECONDS:600}
    password-reset:
      max-attempts: ${COMESEBEBES_PASSWORD_RESET_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${COMESEBEBES_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:900}
  storage:
    # "local" (padrao, filesystem) ou "blob" (Azure Blob Storage, Managed Identity).
    type: ${COMESEBEBES_STORAGE_TYPE:local}
    local:
      path: ${COMESEBEBES_IMAGE_STORAGE_PATH:./uploads/images}
    blob:
      account-url: ${COMESEBEBES_STORAGE_BLOB_ACCOUNT_URL:}
      container: ${COMESEBEBES_STORAGE_BLOB_CONTAINER:comesebebes-images}
      identity-client-id: ${COMESEBEBES_STORAGE_BLOB_IDENTITY_CLIENT_ID:}
  image-validator:
    url: ${COMESEBEBES_IMAGE_VALIDATOR_URL:http://localhost:8001}
    connect-timeout-ms: ${COMESEBEBES_IMAGE_VALIDATOR_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${COMESEBEBES_IMAGE_VALIDATOR_READ_TIMEOUT_MS:20000}
  cors:
    allowed-origins: ${COMESEBEBES_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  webauthn:
    relying-party-id: ${COMESEBEBES_WEBAUTHN_RP_ID:localhost}
    relying-party-name: ${COMESEBEBES_WEBAUTHN_RP_NAME:Comes&Bebes}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 50
  datasource:
    # DB_URL_PARAMS fica vazio localmente (o Postgres compartilhado não exige SSL) e
    # vira "?sslmode=require" no Azure Database for PostgreSQL Flexible Server, que
    # exige SSL por padrão.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:comesebebes}${DB_URL_PARAMS:}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: flyway,application
    default-schema: flyway
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: application

server:
  port: ${COMESEBEBES_SERVER_PORT:8092}
  tomcat:
    max-http-form-post-size: 16MB
    max-swallow-size: 16MB
  error:
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-} sessionId=%X{sessionId:-} userId=%X{userId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # So health - nao expor env/beans/heapdump etc. sem necessidade.
        include: health
  endpoint:
    health:
      # Habilita /actuator/health/liveness e /actuator/health/readiness (grupos
      # de probe), uteis pro Container Apps configurar liveness/readiness
      # separados; por padrao so ativa automaticamente em ambiente Kubernetes.
      probes:
        enabled: true

azure:
  communication:
    email:
      # So usados quando app.email.delivery-mode=azure — o bean condicional
      # (AzureEmailConfig) nem existe em modo "log".
      endpoint: ${COMESEBEBES_EMAIL_AZURE_ENDPOINT:}
      access-key: ${COMESEBEBES_EMAIL_AZURE_ACCESS_KEY:}

springdoc:
  swagger-ui:
    doc-expansion: none
    display-request-duration: true
    filter: true
    url: ${COMESEBEBES_SWAGGER_UI_URL:/v3/api-docs}
    config-url: ${COMESEBEBES_SWAGGER_CONFIG_URL:/v3/api-docs/swagger-config}
    oauth2-redirect-url: ${COMESEBEBES_SWAGGER_OAUTH2_REDIRECT_URL:/swagger-ui/oauth2-redirect.html}
  show-actuator: false
