services:
  validator:
    build:
      context: .
      dockerfile: validator/Dockerfile
    expose:
      - "8001"
    ports:
      - "${COMESEBEBES_VALIDATOR_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./infra/.env
    environment:
      SHARED_DB_HOST: ${SHARED_DB_HOST:-host.docker.internal}
      COMESEBEBES_IMAGE_VALIDATOR_URL: http://validator:8001
      COMESEBEBES_IMAGE_STORAGE_PATH: /app/uploads/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      validator:
        condition: service_healthy
    ports:
      - "${COMESEBEBES_SERVER_PORT:-8082}:8082"
    volumes:
      - ./uploads/images:/app/uploads/images
    restart: unless-stopped
