name: comesebebes

services:
  validator:
    image: fagnerrumenigg/comesebebes-validator:${VALIDATOR_VERSION}
    environment:
      HF_HOME: /var/cache/huggingface
    volumes:
      - validator_model_cache:/var/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - private
    restart: unless-stopped

  api:
    image: fagnerrumenigg/comesebebes-api:${API_VERSION}
    env_file:
      - .env
    environment:
      DB_HOST: platform-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-comesebebes}
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME em infra/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em infra/.env}
      COMESEBEBES_SERVER_PORT: 8082
      COMESEBEBES_IMAGE_VALIDATOR_URL: http://validator:8001
      COMESEBEBES_IMAGE_STORAGE_PATH: /app/uploads/images
      COMESEBEBES_SWAGGER_UI_URL: /comesebebes/v3/api-docs
      COMESEBEBES_SWAGGER_CONFIG_URL: /comesebebes/v3/api-docs/swagger-config
      COMESEBEBES_SWAGGER_OAUTH2_REDIRECT_URL: /comesebebes/swagger-ui/oauth2-redirect.html
    depends_on:
      validator:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8082}:8082"
    volumes:
      - ../backend/uploads/images:/app/uploads/images
    healthcheck:
      # A imagem nao tem curl/wget; abre a conexao via /dev/tcp e confirma que a
      # resposta HTTP de /actuator/health foi 200 (nao so que a porta aceita TCP).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8082 &&
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      edge:
        aliases:
          - comesebebes-api
      data: {}
      private: {}
    restart: unless-stopped

volumes:
  validator_model_cache:
    name: comesebebes_validator_model_cache

networks:
  edge:
    name: platform-edge
    external: true
  data:
    name: platform-data
    external: true
  private:
    name: comesebebes-private
