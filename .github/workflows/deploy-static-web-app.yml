name: Deploy Comes-Bebes frontend to Azure Static Web Apps

# Substitui o GitHub Pages (deploy-pages.yml) aos poucos — os dois ficam
# ativos em paralelo até confirmar que o Static Web App está bom; depois
# disso, remover deploy-pages.yml e a origem antiga da CORS/allowed
# origins da API (ver infra/terraform/main/main.tf).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-static-web-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-web-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: test -n "$VITE_API_BASE_URL" || (echo "Configure a repository variable named VITE_API_BASE_URL" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          # Static Web Apps serve da raiz do domínio, não de um subpath tipo
          # /Comes-Bebes/ (isso era só a convenção do GitHub Pages).
          VITE_APP_BASE_PATH: /
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENABLE_MOCKS: "false"
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_KEY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
