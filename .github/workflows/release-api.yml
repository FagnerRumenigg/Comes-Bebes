name: Release Comes-Bebes API

on:
  push:
    tags:
      - "api-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário pro login OIDC na Azure (sem client secret)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # precisa bater com o subject da federated identity credential
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Resolve release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#api-v}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Login na Azure (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CICD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login no Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/comesebebes-api:${{ steps.version.outputs.version }}
            ${{ vars.ACR_LOGIN_SERVER }}/comesebebes-api:sha-${{ steps.version.outputs.short_sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/comesebebes-api:latest
