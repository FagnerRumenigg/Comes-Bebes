name: Release Comes-Bebes image-validator

on:
  push:
    tags:
      - "validator-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário pro login OIDC na Azure (sem client secret)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # precisa bater com o subject da federated identity credential
    defaults:
      run:
        working-directory: backend/validator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/validator/requirements.txt
            backend/validator/requirements-model.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt httpx
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm transformers safetensors

      - name: Test
        run: pytest tests/ -q

      - name: Resolve release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#validator-v}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Login na Azure (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CICD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login no Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/validator/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/comesebebes-validator:${{ steps.version.outputs.version }}
            ${{ vars.ACR_LOGIN_SERVER }}/comesebebes-validator:sha-${{ steps.version.outputs.short_sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/comesebebes-validator:latest
