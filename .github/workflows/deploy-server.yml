name: Deploy release to production

on:
  workflow_run:
    workflows:
      - "Release Comes-Bebes API"
      - "Release Comes-Bebes image-validator"
    types:
      - completed

permissions:
  contents: read
  id-token: write # necessário pro login OIDC na Azure (sem client secret)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production # precisa bater com o subject da federated identity credential
    steps:
      - name: Resolve service, versão e Container App
        id: release
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [[ "$TAG" == api-v* ]]; then
            echo "version=${TAG#api-v}" >> "$GITHUB_OUTPUT"
            echo "container_app=${{ vars.API_CONTAINER_APP_NAME }}" >> "$GITHUB_OUTPUT"
            echo "image=comesebebes-api" >> "$GITHUB_OUTPUT"
          else
            echo "version=${TAG#validator-v}" >> "$GITHUB_OUTPUT"
            echo "container_app=${{ vars.VALIDATOR_CONTAINER_APP_NAME }}" >> "$GITHUB_OUTPUT"
            echo "image=comesebebes-validator" >> "$GITHUB_OUTPUT"
          fi

      - name: Login na Azure (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CICD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar Container App
        run: |
          az containerapp update \
            --name "${{ steps.release.outputs.container_app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show \
            --name "${{ steps.release.outputs.container_app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$FQDN" ]; then
            echo "Container App sem ingress externo (validador) - pulando smoke test HTTP."
            exit 0
          fi
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/actuator/health/readiness" || true)
            if [ "$CODE" = "200" ]; then
              echo "Smoke test OK ($CODE) após $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test falhou - /actuator/health/readiness não respondeu 200 em 5 minutos."
          exit 1
